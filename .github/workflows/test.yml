name: Test Suite

# CI exercise for the behavior-lock test harness. Runs the full test suite
# (make test -> devtools::test()) with NO API-credential secrets — the suite
# must be green offline with REDCAP_API_TOKEN / GOOGLE_SERVICE_ACCOUNT_JSON /
# ABS_USERNAME / ABS_PASSWORD / STATICRYPT_PASSWORD all unset.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R dependencies from DESCRIPTION
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          # devtools is the make test runner (not a package dependency); pak
          # installs it as a binary from RSPM. A separate
          # install.packages("devtools", repos="https://cloud.r-project.org")
          # forced SOURCE builds whose textshaping/ragg compiles failed without
          # system libs (silently, with exit 0), leaving devtools absent.
          extra-packages: devtools

      - name: Run test suite (no API credentials)
        run: make test
